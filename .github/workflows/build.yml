name: Compilar Astral Hub APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Compilar APK con Flet
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: AstralHub-Instalador
          path: build/apk/*.apk
